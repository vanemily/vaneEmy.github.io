---
layout: default
---
<section class="room room-compact room-blog" id="post">
  <div class="room-inner">
    <a href="{{ '/blog/' | relative_url }}" class="room-label reveal">← memorias</a>
    <h2 class="room-title reveal">{{ page.title }}</h2>
    <p class="room-text reveal" style="font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;color:var(--text-light);text-transform:uppercase;margin-top:-1rem;">
      {% include fecha-es.html fecha=page.date %}
    </p>
    <div class="post-content reveal">
      {{ content }}
    </div>
  </div>
</section>
