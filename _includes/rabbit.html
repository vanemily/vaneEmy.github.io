<div class="rabbit-hole" aria-hidden="true"></div>
{% comment %} En «sobre mí» el conejito se quedó dentro del hoyo {% endcomment %}
{% unless page.url == '/sobre/' %}
<button type="button" id="rabbit" class="resting" data-href="{{ '/sobre/' | relative_url }}" aria-label="Hacer sonreír al conejito" data-en-label="Make the bunny smile">{{ conejo }}</button>
{% endunless %}
