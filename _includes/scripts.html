<script type="application/json" id="wiki-index">
[
  {"title": "Inicio", "url": {{ '/' | relative_url | jsonify }}}
  {% assign wiki_pages = site.pages | where_exp: "p", "p.title" %}
  {% assign wiki_items = site.posts | concat: wiki_pages %}
  {% for item in wiki_items %},
  {"title": {{ item.title | jsonify }}, "url": {{ item.url | relative_url | jsonify }}}
  {% endfor %}
]
</script>
<script type="application/json" id="posts-data">
[
  {% for post in site.posts %}
  {"title": {{ post.title | jsonify }}, "url": {{ post.url | relative_url | jsonify }}, "date": {{ post.date | date: "%Y-%m-%d" | jsonify }}, "tags": {{ post.tags | jsonify }}, "excerpt": {{ post.excerpt | strip_html | jsonify }}}{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
